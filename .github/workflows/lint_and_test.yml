# Lint and testing the workflow for ci/cd

name: Lint and Test

on:
    workflow_dispatch

permissions:
    contents: read

jobs:
    code-and-lint:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        
        steps:
            - name: code checkout
              uses: actions/checkout@v7

            - name: setup node.js
              uses: actions/setup-node@v7
              with:
                node-version: 22
                cache: 'npm'
                cache-dependency-path: backend/package-lock.json
            - run: npm ci

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint

            - name: Check formatting with Prettier
              run: npx prettier --check .
                