# Goal: To create a dummy ci-cd pipeline

name: Dummy CI-CD

on:
    workflow_dispatch

jobs:
    code:
        runs-on: ubuntu-latest
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7

    build:
        needs: code
        runs-on: ubuntu-latest
        steps:
            - name: Build the Docker setup
              uses: docker/setup-docker-action@v5

    test:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Test the code
              run: echo "Testing the code, test passed"

    deploy:
        needs: ["code", "build", "test"]
        runs-on: ubuntu-latest
        steps:
            - name: Deploy the Application on Server
              run: echo "Deployed the Application"

            