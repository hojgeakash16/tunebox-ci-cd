# The workflow is for Docker Image scanning

name: Trivy Scan

on:
    workflow_dispatch

jobs:
    trivy-scan:
        runs-on: ubuntu-latest
        steps:
            - name: code checkout
              uses: actions/checkout@v7

            - name: Build the Docker setup
              uses: docker/setup-docker-action@v5

            - name: Docker Login
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_PASSWORD }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build Frontend Image
              uses: docker/build-push-action@v7
              with:
                context: ./frontend
                load: true
                push: false
                tags: ${{ vars.DOCKERHUB_USERNAME }}/tunebox-frontend:latest

            - name: Build Backend Image
              uses: docker/build-push-action@v7
              with:
                context: ./backend
                load: true
                push: false
                tags: ${{ vars.DOCKERHUB_USERNAME }}/tunebox-backend:latest

            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: '${{ vars.DOCKERHUB_USERNAME }}/tunebox-frontend:latest'
                format: 'table'
                exit-code: '0'
                ignore-unfixed: true
                vuln-type: 'os,library'
                severity: 'CRITICAL,HIGH'

            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: '${{ vars.DOCKERHUB_USERNAME }}/tunebox-backend:latest'
                format: 'table'
                exit-code: '0'
                ignore-unfixed: true
                vuln-type: 'os,library'
                severity: 'CRITICAL,HIGH'

            