name: tunebox

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tunebox}
      POSTGRES_USER: ${POSTGRES_USER:-tunebox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tunebox_dev_pw}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend_net]
    restart: unless-stopped

  backend:
    build: ./backend
    image: tunebox-backend:local
    environment:
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-tunebox}:${POSTGRES_PASSWORD:-tunebox_dev_pw}@db:5432/${POSTGRES_DB:-tunebox}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-please-32-chars-min}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend_net, frontend_net]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: tunebox-frontend:local
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks: [frontend_net]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

networks:
  backend_net:
  frontend_net:

volumes:
  db_data:
